# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration scripts
# file_template = %%(rev)s_%%(slug)s

# sys.path path, used to find modules
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# timezone =

# max length of characters to use for the "slug" field
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow empty migrations to be created
# and written to the script directory
# allow_empty_history = false

# version location specification; this defaults
# to alembic/versions.  When using multiple version
# directories, paths must be separated by semicolons.
# version_locations = %(here)s/bar:%(here)s/bat;alembic/versions

# version path separator; defaults to ';'
# version_path_separator = ;

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
